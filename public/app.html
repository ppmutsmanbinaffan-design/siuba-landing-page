  <body>
    <div id="root"></div>
    <script>
      (function () {
        if ((window.location.pathname === '/' || window.location.pathname === '') && window.location.search.indexOf('app=1') === -1) {
          window.location.replace('/beranda');
          return;
        }
        function syncBackLink() {
          var existing = document.getElementById('siuba-back-landing');
          var isLogin = window.location.pathname === '/login' || window.location.pathname === '/masuk';
          if (isLogin && !existing) {
            var a = document.createElement('a');
            a.id = 'siuba-back-landing';
            a.href = '/beranda';
            a.innerHTML = '&larr; Kembali ke Beranda';
            a.style.cssText = 'position:fixed;top:16px;left:16px;z-index:9999;background:rgba(255,255,255,0.92);color:#0d331d;border:1px solid #d4d4d8;padding:7px 14px;border-radius:9999px;font-family:sans-serif;font-size:12px;font-weight:700;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.08);backdrop-filter:blur(8px);';
            document.body.appendChild(a);
          } else if (!isLogin && existing) {
            existing.remove();
          }
        }
        setInterval(syncBackLink, 400);
        window.addEventListener('DOMContentLoaded', syncBackLink);
      })();
    </script>
  </body>

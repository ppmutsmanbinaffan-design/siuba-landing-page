  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        if ((window.location.pathname === '/' || window.location.pathname === '') && window.location.search.indexOf('app=1') === -1) {
          window.location.replace('/beranda');
          return;
        }
        function syncBackLink() {
          var existing = document.getElementById('siuba-back-landing');
          var isLogin = window.location.pathname === '/login' || window.location.pathname === '/masuk';
          if (isLogin && !existing) {
            var a = document.createElement('a');
            a.id = 'siuba-back-landing';
            a.href = '/beranda';
            a.innerHTML = '&larr; Kembali ke Beranda';
            a.style.cssText = 'position:fixed;top:16px;left:16px;z-index:9999;background:rgba(255,255,255,0.92);color:#0d331d;border:1px solid #d4d4d8;padding:7px 14px;border-radius:9999px;font-family:sans-serif;font-size:12px;font-weight:700;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,0.08);backdrop-filter:blur(8px);';
            document.body.appendChild(a);
          } else if (!isLogin && existing) {
            existing.remove();
          }
        }
        setInterval(syncBackLink, 400);
        window.addEventListener('DOMContentLoaded', syncBackLink);

        function injectSidebarCmsMenu() {
          var navList = document.getElementById('nav-list');
          if (!navList || document.getElementById('nav-btn-cms-landing')) return;

          try {
            var userStr = localStorage.getItem('siuba_auth_user') || sessionStorage.getItem('siuba_auth_user');
            if (userStr) {
              var u = JSON.parse(userStr);
              var role = (u.role || '').toLowerCase();
              var allowedRoles = ['super-admin', 'super_admin', 'admin', 'operator', 'pimpinan', 'kepala-sekolah'];
              if (allowedRoles.indexOf(role) === -1) return;
            }
          } catch (e) {}

          var wrapper = document.createElement('div');
          wrapper.id = 'sidebar-cms-group';
          wrapper.className = 'space-y-3 pt-2 border-t border-[#1a4a39]';
          wrapper.innerHTML =
            '<div class="space-y-1">' +
              '<p class="px-2 text-[10px] font-bold uppercase tracking-wider text-emerald-300/50">PENERIMAAN SANTRI BARU</p>' +
              '<a id="nav-btn-ppdb-admin" href="/manajemen-ppdb" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold transition-all min-h-[42px] cursor-pointer text-emerald-100/90 hover:bg-[#1a4a39] hover:text-white">' +
                '<div class="flex items-center gap-2.5 truncate">' +
                  '<span style="color:#a3e635;font-size:15px;">&#127891;</span>' +
                  '<span class="truncate">Manajemen PPDB Santri</span>' +
                '</div>' +
                '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0 bg-lime-400/20 text-lime-300 border border-lime-400/30">PPDB</span>' +
              '</a>' +
            '</div>' +
            '<div class="space-y-1 pt-2 border-t border-[#1a4a39]">' +
              '<p class="px-2 text-[10px] font-bold uppercase tracking-wider text-emerald-300/50">MANAJEMEN WEBSITE</p>' +
              '<a id="nav-btn-cms-landing" href="/cms-landing" class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-bold transition-all min-h-[42px] cursor-pointer text-emerald-100/90 hover:bg-[#1a4a39] hover:text-white">' +
                '<div class="flex items-center gap-2.5 truncate">' +
                  '<span style="color:#EADAA2;font-size:15px;">&#9998;</span>' +
                  '<span class="truncate">CMS Profil &amp; Berita</span>' +
                '</div>' +
                '<span class="px-2 py-0.5 rounded-full text-[10px] font-semibold shrink-0 bg-[#C9A227]/20 text-[#EADAA2] border border-[#C9A227]/30">CMS</span>' +
              '</a>' +
              '<a href="/beranda" target="_blank" class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium transition-all cursor-pointer text-emerald-200/75 hover:bg-[#1a4a39] hover:text-white">' +
                '<div class="flex items-center gap-2.5 truncate">' +
                  '<span style="color:#6ee7b7;font-size:14px;">&#127760;</span>' +
                  '<span class="truncate">Lihat Landing Page</span>' +
                '</div>' +
              '</a>' +
            '</div>';
          navList.insertBefore(wrapper, navList.firstChild);
        }
        setInterval(injectSidebarCmsMenu, 500);
      })();
    </script>
  </body>
</html>
